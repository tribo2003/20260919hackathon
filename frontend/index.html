<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Learning Planner</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <!-- 左上：Learning Roadmap -->
        <section class="timeline">
            <div class="card">
                <h2>Learning Roadmap</h2>

                <!-- Gantt Chart 之後由 JavaScript 放進來 -->
                <div id="gantt-chart"></div>
            </div>
        </section>


        <!-- 左下：Learning Details -->
        <section class="details">
            <div class="card">
                <h2>Learning Details</h2>

                <!-- 使用者點擊 Gantt Chart 的 event 後，
                     之後可以在這裡顯示詳細資訊 -->
                <div id="learning-details">
                    <p>Select a learning event to see details.</p>
                </div>
            </div>
        </section>


        <!-- 右上：User Input -->
        <aside class="user-input">
            <div class="card">
                <h2>Your Career Goal</h2>

                <!-- Resume -->
                <label for="resume">Resume</label>
                <input type="file" id="resume">

                <!-- Desired Job -->
                <label for="desired-job">Desired Job</label>
                <input
                    type="text"
                    id="desired-job"
                    placeholder="e.g. Data Engineer"
                >

                <!-- Company -->
                <label for="company">Company (Optional)</label>
                <input
                    type="text"
                    id="company"
                    placeholder="e.g. Google"
                >

                <!-- Specific Job -->
                <label for="specific-job">Specific Job (Optional)</label>
                <input
                    type="text"
                    id="specific-job"
                    placeholder="Paste job description or job title"
                >

                <button id="generate-plan">
                    Generate Learning Plan
                </button>
            </div>
        </aside>


        <!-- 右下：Skill Rating  Top5-->
        <aside class="skills">
            <div class="card">
                <h2>Skill Rating</h2>

                <div id="skill-rating">
                    <!-- AI 之後可以把技能評級放在這裡 -->
                </div>
            </div>
        </aside>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
